<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abyss</title>
<meta name="description" content="A press-your-luck finance quiz. Rare answers score big. Dive deeper for bigger multipliers, or surface and bank your haul.">
<meta property="og:title" content="Abyss">
<meta property="og:description" content="A press-your-luck finance quiz. How deep can you go?">
<meta name="theme-color" content="#2F8FA3">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --font: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --on-sea: #F0F8F9;
  --on-sea-dim: rgba(240, 248, 249, 0.74);
  --panel: rgba(244, 250, 251, 0.94);
  --panel-line: #C9E0E5;
  --ink: #0E2A3A;
  --ink-dim: #4A6674;
  --krill: #E8604E;
  --krill-soft: #FCE3DE;
  --gold: #8A5F00;
  --good: #1E7A55;
  --bad: #B33A2B;
  --btn: #0E2A3A;
  --btn-ink: #F4FAFB;
  --field: #FFFFFF;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: rgba(4, 10, 24, 0.66);
    --panel-line: rgba(180, 220, 230, 0.18);
    --ink: #EAF4F6;
    --ink-dim: #9DB7C0;
    --krill: #FF8C7A;
    --krill-soft: rgba(255, 140, 122, 0.16);
    --gold: #F5C451;
    --good: #6FD6A6;
    --bad: #FF8C7A;
    --btn: #EAF4F6;
    --btn-ink: #071022;
    --field: rgba(255, 255, 255, 0.06);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --panel: rgba(4, 10, 24, 0.66);
  --panel-line: rgba(180, 220, 230, 0.18);
  --ink: #EAF4F6;
  --ink-dim: #9DB7C0;
  --krill: #FF8C7A;
  --krill-soft: rgba(255, 140, 122, 0.16);
  --gold: #F5C451;
  --good: #6FD6A6;
  --bad: #FF8C7A;
  --btn: #EAF4F6;
  --btn-ink: #071022;
  --field: rgba(255, 255, 255, 0.06);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100%;
  font-family: var(--font);
  background-color: #2F8FA3;
  color: var(--on-sea);
  transition: background-color 1.4s ease;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
#ocean { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#vignette {
  position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse at center, transparent 45%, rgba(120, 0, 10, 0.75) 100%);
  transition: opacity .3s;
}
#flash { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0; }
#flash.go { animation: flash .6s ease-out; }
#fx { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }

.wrap {
  position: relative; z-index: 1;
  max-width: 880px; margin: 0 auto;
  padding: 28px 20px 48px;
  display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 32px;
}

/* Depth rail */
.rail { position: relative; padding-top: 8px; }
.rail-line { position: absolute; left: 12px; top: 16px; bottom: 16px; width: 2px; background: rgba(240, 248, 249, 0.28); }
.stop { position: relative; display: flex; gap: 14px; align-items: flex-start; height: 96px; }
.stop:last-child { height: auto; }
.tick {
  flex: none; width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid rgba(240, 248, 249, 0.4);
  background: rgba(0, 0, 0, 0.15);
  transition: border-color .4s, background-color .4s, box-shadow .4s, transform .4s;
  position: relative; z-index: 1;
}
.stop.passed .tick { border-color: var(--on-sea); background: rgba(240, 248, 249, 0.35); }
.stop.here .tick {
  border-color: #FF8C7A; background: #FF8C7A; transform: scale(1.12);
  box-shadow: 0 0 0 6px rgba(255, 140, 122, 0.22), 0 0 26px rgba(255, 140, 122, 0.8);
  animation: beacon 1.6s ease-in-out infinite;
}
.stop-text { font-size: 13px; line-height: 1.3; color: var(--on-sea-dim); padding-top: 3px; }
.stop-text b { display: block; font-weight: 600; color: var(--on-sea); font-size: 14px; }

/* Readout */
.readout { margin-bottom: 22px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
h1 { font-size: 15px; font-weight: 600; margin: 0; color: var(--on-sea-dim); letter-spacing: 0.01em; }
.mute {
  font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  padding: 6px 12px; border-radius: 99px;
  border: 1px solid rgba(240, 248, 249, 0.35); background: rgba(0, 0, 0, 0.12); color: var(--on-sea);
}
.depth-num {
  font-size: clamp(64px, 14vw, 128px); font-weight: 800; line-height: 0.88; letter-spacing: -0.045em;
  font-variant-numeric: tabular-nums; font-variation-settings: "opsz" 96; margin: 0;
  text-shadow: 0 2px 30px rgba(0, 0, 0, 0.18);
}
.depth-num small { font-size: 0.32em; letter-spacing: -0.01em; font-weight: 600; margin-left: 6px; }
.zone-line { font-size: 18px; margin-top: 10px; color: var(--on-sea-dim); }
.zone-line strong { color: var(--on-sea); font-weight: 600; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 18px; font-size: 15px; color: var(--on-sea-dim); }
.stats strong { color: var(--on-sea); font-weight: 600; font-variant-numeric: tabular-nums; display: inline-block; }
.stats strong.bump { animation: bump .45s ease-out; }
.stats [hidden] { display: none; }

/* Panel */
.panel {
  background: var(--panel); color: var(--ink);
  border: 1px solid var(--panel-line); border-radius: 18px;
  padding: 26px 26px 24px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 20px 60px rgba(0, 10, 30, 0.25);
}
.panel.enter > * { animation: enter .45s cubic-bezier(.2, .8, .2, 1) both; }
.panel.enter > *:nth-child(2) { animation-delay: .05s; }
.panel.enter > *:nth-child(3) { animation-delay: .1s; }
.panel.enter > *:nth-child(4) { animation-delay: .15s; }
.panel.enter > *:nth-child(n+5) { animation-delay: .2s; }
.panel.shake { animation: shake .45s cubic-bezier(.36, .07, .19, .97); }
.prompt { font-size: clamp(24px, 4.2vw, 32px); font-weight: 600; line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.015em; }
.sub { color: var(--ink-dim); margin: 0 0 18px; font-size: 15px; line-height: 1.5; max-width: 60ch; }

.air { height: 10px; border-radius: 99px; background: var(--krill-soft); overflow: hidden; margin: 0 0 18px; }
.air-fill { height: 100%; width: 100%; background: var(--krill); border-radius: 99px; transform-origin: left; }
.air.low .air-fill { animation: pulse .5s ease-in-out infinite; background: var(--bad); }
.air-label { font-size: 13px; color: var(--ink-dim); margin: -12px 0 16px; font-variant-numeric: tabular-nums; }

.row { display: flex; gap: 10px; }
input[type="text"] {
  flex: 1; min-width: 0; font: inherit; font-size: 18px; padding: 13px 15px;
  border-radius: 12px; border: 1.5px solid var(--panel-line); background: var(--field); color: var(--ink);
}
input[type="text"]:focus { outline: none; border-color: var(--krill); box-shadow: 0 0 0 3px var(--krill-soft); }
button {
  font: inherit; font-size: 16px; font-weight: 600; padding: 13px 18px; border-radius: 12px; cursor: pointer;
  border: 1.5px solid var(--btn); background: var(--btn); color: var(--btn-ink);
  transition: transform .12s ease;
}
button:active { transform: scale(0.96); }
button.ghost { background: transparent; color: var(--ink); border-color: var(--panel-line); }
button.dive { background: #FF8C7A; border-color: #FF8C7A; color: #1A0703; position: relative; overflow: hidden; }
button.dive::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.55), transparent);
  animation: sheen 2.6s ease-in-out infinite;
}
button:focus-visible, input:focus-visible, .mute:focus-visible { outline: 3px solid #FF8C7A; outline-offset: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }

.msg { min-height: 22px; margin-top: 12px; font-size: 15px; line-height: 1.45; }
.msg.bad { color: var(--bad); }
.msg.note { color: var(--ink-dim); }

.catch { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 4px 0 8px; }
.catch-pts { font-size: 56px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; color: var(--good); font-variant-numeric: tabular-nums; }
.catch-pts.lost { color: var(--bad); }
.catch-name { font-size: 22px; font-weight: 600; }
.tier { display: inline-block; font-size: 14px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--krill-soft); color: var(--ink); }
.tier.k { background: linear-gradient(90deg, #FF8C7A, #F5C451, #FF8C7A); background-size: 200% 100%; color: #1A0703; animation: shimmer 1.6s linear infinite; }
.tier.stamp { animation: stamp .5s cubic-bezier(.2, .8, .2, 1) both; }
.tier.k.stamp { animation: stamp .5s cubic-bezier(.2, .8, .2, 1) both, shimmer 1.6s linear .5s infinite; }

.ledger { margin: 18px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--panel-line); }
.ledger li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--panel-line); font-size: 15px; }
.ledger li > span:last-child { font-variant-numeric: tabular-nums; color: var(--ink-dim); }
.rules { margin: 0; padding-left: 20px; line-height: 1.6; font-size: 16px; max-width: 60ch; }
.rules li { margin-bottom: 6px; }
.scale { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 4px; }
.gold { color: var(--gold); }
.examples { font-size: 15px; color: var(--ink-dim); line-height: 1.5; margin-top: 14px; }
.examples strong { color: var(--ink); font-weight: 600; }

/* Effects */
.float {
  position: absolute; transform: translate(-50%, 0); white-space: nowrap;
  font-family: var(--font); font-weight: 800; font-size: 40px; letter-spacing: -0.03em;
  color: #6FD6A6; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.35);
  animation: floatUp 1.2s cubic-bezier(.2, .8, .2, 1) forwards;
}
.float.k { color: #F5C451; font-size: 56px; }
.float.fall { color: #FF8C7A; animation: fallDown 1.1s ease-in forwards; }
.banner {
  position: absolute; left: 50%; top: 42%; white-space: nowrap;
  font-family: var(--font); font-weight: 800; letter-spacing: -0.04em;
  font-size: clamp(40px, 9vw, 96px); color: #F5C451;
  text-shadow: 0 0 30px rgba(245, 196, 81, 0.7), 0 4px 0 #8A3A2E;
  animation: banner 1.8s cubic-bezier(.2, .8, .2, 1) forwards;
}
.coin { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #F5C451; box-shadow: 0 0 12px rgba(245, 196, 81, 0.9); }

@keyframes enter { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(5px); } 30%, 50%, 70% { transform: translateX(-9px); } 40%, 60% { transform: translateX(9px); } }
@keyframes pulse { 50% { opacity: 0.45; } }
@keyframes beacon { 50% { box-shadow: 0 0 0 11px rgba(255, 140, 122, 0.08), 0 0 34px rgba(255, 140, 122, 0.9); } }
@keyframes bump { 40% { transform: scale(1.35); color: #F5C451; } }
@keyframes sheen { 0%, 55% { left: -60%; } 100% { left: 130%; } }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes stamp { 0% { transform: scale(2.4); opacity: 0; } 60% { transform: scale(0.9); opacity: 1; } 100% { transform: scale(1); } }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 10px) scale(0.6); } 15% { opacity: 1; transform: translate(-50%, -10px) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -110px) scale(1); } }
@keyframes fallDown { 0% { opacity: 1; transform: translate(-50%, 0) rotate(0); } 100% { opacity: 0; transform: translate(-50%, 140px) rotate(16deg); } }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4) rotate(-6deg); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.1) rotate(-3deg); } 75% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-3deg); } 100% { opacity: 0; transform: translate(-50%, -70%) scale(1.04) rotate(-3deg); } }
@keyframes flash { 0% { opacity: 0.55; } 100% { opacity: 0; } }


.stats.home .ingame { display: none; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0 6px; }
.mode {
  text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 18px;
  background: var(--field); color: var(--ink); border: 1.5px solid var(--panel-line); border-radius: 16px;
}
.mode b { font-size: 20px; letter-spacing: -0.01em; }
.mode span { font-weight: 400; font-size: 14px; line-height: 1.45; color: var(--ink-dim); }
.mode .meta { font-weight: 600; color: var(--ink); }
.mode.daily { border-color: #FF8C7A; box-shadow: 0 0 0 3px var(--krill-soft); }
.mode:disabled { cursor: default; opacity: 0.85; box-shadow: none; }
.mode:disabled:active { transform: none; }
.nav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.nav button { font-size: 15px; padding: 10px 14px; }
.back { margin-bottom: 14px; font-size: 14px; padding: 8px 12px; }
.section-h { font-size: 17px; font-weight: 600; margin: 22px 0 4px; }
.section-note { font-size: 14px; color: var(--ink-dim); margin: 0 0 8px; }
.shop { list-style: none; margin: 0; padding: 0; }
.shop li { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--panel-line); }
.shop li:last-child { border-bottom: 0; }
.shop .info b { display: block; font-size: 16px; }
.shop .info span { display: block; font-size: 14px; color: var(--ink-dim); line-height: 1.4; margin-top: 2px; }
.shop button { flex: none; font-size: 14px; padding: 9px 14px; white-space: nowrap; }
.shop button:disabled { opacity: 0.45; cursor: default; }
.shop .info span.swatch, .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.bar { height: 8px; border-radius: 99px; background: var(--krill-soft); overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; background: var(--krill); border-radius: 99px; }
.logcat { border-bottom: 1px solid var(--panel-line); }
.logcat summary { list-style: none; cursor: pointer; padding: 12px 0; display: block; }
.logcat summary::-webkit-details-marker { display: none; }
.logcat .top { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
.logcat .top span:last-child { color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 0 14px; }
.chip { font-size: 13px; padding: 4px 9px; border-radius: 99px; background: var(--krill-soft); }
.chip.k { background: #F5C451; color: #1A0703; }
.chip.r { background: #FF8C7A; color: #1A0703; }
.chip.hidden { background: transparent; border: 1px dashed var(--panel-line); color: var(--ink-dim); }
.grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 6px 0; }
.grid-stats div { padding: 12px; border-radius: 12px; background: var(--field); border: 1px solid var(--panel-line); }
.grid-stats b { display: block; font-size: 26px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.grid-stats span { font-size: 13px; color: var(--ink-dim); }
.chart { width: 100%; height: 120px; display: block; margin-top: 8px; }
.ach { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.ach li { padding: 10px 12px; border-radius: 12px; border: 1px solid var(--panel-line); font-size: 14px; line-height: 1.35; }
.ach li b { display: block; font-size: 15px; }
.ach li span { color: var(--ink-dim); }
.ach li.locked { opacity: 0.5; }
.ach li.got { border-color: #F5C451; }
.compare { margin: 14px 0 0; padding: 14px; border-radius: 12px; background: var(--field); border: 1px solid var(--panel-line); font-size: 15px; line-height: 1.55; }
.compare strong { font-variant-numeric: tabular-nums; }
.board { margin: 8px 0 0; padding-left: 22px; font-size: 14px; line-height: 1.7; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.tools button { font-size: 14px; padding: 8px 12px; }
.tools button.armed { background: #F5C451; border-color: #F5C451; color: #1A0703; }
.hint { font-size: 15px; margin-top: 10px; color: var(--ink); letter-spacing: 0.08em; font-weight: 600; }
.namefield { display: flex; gap: 8px; margin-top: 8px; }
.namefield input { font-size: 16px !important; padding: 10px 12px !important; }
.namefield button { font-size: 14px; padding: 10px 14px; }
.toast {
  position: absolute; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  background: #0B1730; color: #F0F8F9; border: 1px solid #F5C451; border-radius: 14px;
  padding: 10px 16px; font-family: var(--font); font-size: 15px; white-space: nowrap;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); animation: toast 3.2s cubic-bezier(.2, .8, .2, 1) forwards;
}
.toast b { color: #F5C451; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -30px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
@media (max-width: 680px) { .modes { grid-template-columns: 1fr; } .toast { white-space: normal; width: calc(100% - 28px); text-align: center; } }

@media (max-width: 680px) {
  .wrap { grid-template-columns: 1fr; gap: 18px; padding: 18px 14px 36px; }
  .rail { display: flex; justify-content: space-between; padding-top: 0; }
  .rail-line { left: 13px; right: 13px; top: 12px; bottom: auto; width: auto; height: 2px; }
  .stop { flex-direction: column; align-items: center; height: auto; gap: 6px; width: 20%; }
  .stop-text { text-align: center; font-size: 11px; padding-top: 0; }
  .stop-text b { font-size: 12px; }
  .stop-text .m { display: none; }
  .panel { padding: 20px 18px; border-radius: 16px; }
  .row { flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<canvas id="ocean" aria-hidden="true"></canvas>
<div id="vignette" aria-hidden="true"></div>
<div id="flash" aria-hidden="true"></div>
<div id="fx" aria-hidden="true"></div>
<div class="wrap">
  <nav class="rail" id="rail" aria-label="Dive depth"></nav>
  <main>
    <div class="readout">
      <div class="topbar"><h1 id="title"></h1><button class="mute" id="mute" type="button"></button></div>
      <p class="depth-num"><span id="depthNum">0</span><small>m</small></p>
      <div class="zone-line" id="zoneLine">At the surface</div>
      <div class="stats" id="stats">
        <span class="ingame">Dive <strong id="sDive">1</strong> of 3</span>
        <span class="ingame">Banked <strong id="sBank">0</strong></span>
        <span class="ingame" id="riskWrap">At risk <strong id="sRisk">0</strong></span>
        <span class="ingame">Spare tanks <strong id="sSpare">1</strong></span>
        <span>🦪 <strong id="sPearls">0</strong> pearls</span>
        <span id="streakWrap">🔥 <strong id="sStreak">0</strong>-day streak</span>
      </div>
    </div>
    <section class="panel" id="panel" aria-live="polite"></section>
  </main>
</div>
<script>
(function () {
  "use strict";

  var GAME_NAME = "Abyss";
  var REDUCE = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  /* Global leaderboard (optional). Fill these in after creating the free Supabase table
     described in the setup notes. Leave them empty and the game runs fully offline. */
  var LEADERBOARD = {
    supabaseUrl: "",
    supabaseAnonKey: ""
  };

  var TIERS = {
    c: { name: "Crowded", pts: 1 },
    u: { name: "Uncommon", pts: 3 },
    r: { name: "Rare", pts: 6 },
    k: { name: "Abyssal", pts: 10 }
  };
  var DIVES_PER_RUN = 3;
  var BASE_AIR = 30;
  var BASE_BONUS = 25;
  var SURFACE_SEA = "#2F8FA3";
  var DAILY_PEARL_MULT = 2;

    if (!save.name) { save.name = "Diver " + (1000 + Math.floor(Math.random() * 9000)); persist(); }
    return save.name;
  }

  /* ---------- Derived gear ---------- */
  function gear(mode) {
    if (mode === "daily") return { air: BASE_AIR, spares: 1, bonus: BASE_BONUS };
    return { air: BASE_AIR + 5 * save.up.tank, spares: 1 + save.up.spare, bonus: HULL_BONUS[save.up.hull] };
  }
  function catLabel(key) { var q = CATS[key].q.replace(/^Name (a|an) /, ""); return q.charAt(0).toUpperCase() + q.slice(1); }
  var TOTAL_ANSWERS = Object.keys(CATS).reduce(function (n, k) { return n + CATS[k].entries.length; }, 0);
  function foundCount() { return Object.keys(save.found).length; }

  /* ---------- State ---------- */
  var S = {
    screen: "home", mode: "free", rng: Math.random, g: gear("free"),
    dive: 0, banked: 0, spares: 1, used: {}, usedCats: {}, depth: -1, haul: 0, cat: null,
    air: BASE_AIR, timer: null, last: null, log: [], pending: [],
    msg: "", msgKind: "", lastTick: 99, charm: false, hint: "", sonarUsed: false,
    newFinds: 0, unlocked: [], allBanked: true, earned: 0
  };

  var $rail = document.getElementById("rail");
  var $panel = document.getElementById("panel");
  var $depthNum = document.getElementById("depthNum");
  var $zoneLine = document.getElementById("zoneLine");
  var $stats = document.getElementById("stats");
  var $sDive = document.getElementById("sDive");
  var $sBank = document.getElementById("sBank");
  var $sRisk = document.getElementById("sRisk");
  var $riskWrap = document.getElementById("riskWrap");
  var $sSpare = document.getElementById("sSpare");
  var $sPearls = document.getElementById("sPearls");
  var $sStreak = document.getElementById("sStreak");
  var $streakWrap = document.getElementById("streakWrap");
  var $mute = document.getElementById("mute");

  document.getElementById("title").textContent = GAME_NAME;
  document.title = GAME_NAME;

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]; }); }
  function fmt(n) { return Number(n).toLocaleString("en-US"); }
  function active() { return S.screen === "question" || S.screen === "caught"; }
  function inGame() { return ["question", "caught", "lost", "banked"].indexOf(S.screen) !== -1; }

  function updateMute() { $mute.textContent = muted ? "🔇 Sound off" : "🔊 Sound on"; $mute.setAttribute("aria-pressed", String(!muted)); }
  $mute.onclick = function () { muted = !muted; save.muted = muted; persist(); updateMute(); if (!muted) sfx.coin(3); };
  updateMute();
  Ocean.setSkin(SKINS[save.skin] || SKINS.coral);

  function toast(html) {
    if (REDUCE) { return; }
    var d = document.createElement("div");
    d.className = "toast"; d.innerHTML = html;
    $fx.appendChild(d);
    setTimeout(function () { d.remove(); }, 3300);
  }
  var toastQueue = [], toastBusy = false;
  function queueToast(html) {
    toastQueue.push(html);
    if (toastBusy) return;
    (function next() {
      var h = toastQueue.shift();
      if (!h) { toastBusy = false; return; }
      toastBusy = true; toast(h);
      setTimeout(next, REDUCE ? 0 : 1600);
    })();
  }

  function addPearls(n) {
    save.pearls += n; save.lifetime += n; persist();
    rollNumber($sPearls, save.pearls, 700); retrigger($sPearls, "bump");
  }

  function unlock(id) {
    if (save.ach[id]) return;
    var a = ACHIEVEMENTS.filter(function (x) { return x.id === id; })[0];
    if (!a) return;
    save.ach[id] = Date.now();
    S.unlocked.push(a);
    addPearls(a.reward);
    queueToast("🏅 <b>" + esc(a.name) + "</b> unlocked, +" + a.reward + " pearls");
    setTimeout(function () { sfx.bank(); }, 150);
  }
  function checkCollection() {
    var n = foundCount();
    if (n >= 50) unlock("found50");
    if (n >= 150) unlock("found150");
    if (n >= 400) unlock("found400");
    var all = Object.keys(CATS).every(function (k) { return CATS[k].entries.some(function (e) { return save.found[e.id]; }); });
    if (all) unlock("allcats");
  }

  function pickCat(d) {
    var opts = DEPTHS[d].cats;
    var fresh = opts.filter(function (c) { return !S.usedCats[c]; });
    var pool = fresh.length ? fresh : opts, c;
    if (S.mode === "daily") {
      c = pool[Math.floor(S.rng() * pool.length)];
    } else {
      pool = pool.slice().sort(function (a, b) { return (save.seen[a] || 0) - (save.seen[b] || 0); });
      var oldest = save.seen[pool[0]] || 0;
      var ties = pool.filter(function (x) { return (save.seen[x] || 0) === oldest; });
      c = ties[Math.floor(Math.random() * ties.length)];
      save.seen[c] = Date.now(); persist();
    }
    S.usedCats[c] = true;
    return c;
  }

  function sample(catKey, tiers, count) {
    var pool = CATS[catKey].entries.filter(function (e) { return tiers.indexOf(e.tier) !== -1 && !S.used[e.id]; });
    var out = [];
    while (pool.length && out.length < count) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0].display);
    return out;
  }

  /* ---------- Timer ---------- */
  function stopTimer() { if (S.timer) { clearInterval(S.timer); S.timer = null; } $vignette.style.opacity = 0; }
  function startTimer() {
    stopTimer();
    var max = S.g.air;
    S.air = max; S.lastTick = 99;
    var started = Date.now();
    S.timer = setInterval(function () {
      S.air = Math.max(0, max - (Date.now() - started) / 1000);
      var fill = document.getElementById("airFill"), label = document.getElementById("airLabel"), bar = document.getElementById("airBar");
      if (fill) fill.style.transform = "scaleX(" + (S.air / max) + ")";
      var secs = Math.ceil(S.air);
      if (label) label.textContent = secs + (secs === 1 ? " second" : " seconds") + " of air";
      if (bar) bar.classList.toggle("low", S.air <= 8);
      $vignette.style.opacity = S.air <= 8 ? String((8 - S.air) / 8 * 0.8) : "0";
      if (secs <= 5 && secs !== S.lastTick && secs > 0) { S.lastTick = secs; sfx.tick(); }
      if (S.air <= 0) { stopTimer(); fail("Out of air."); }
    }, 100);
  }

  /* ---------- Rendering ---------- */
  function setSea() {
    document.body.style.backgroundColor = active() ? DEPTHS[S.depth].sea : SURFACE_SEA;
    Ocean.setZone(active() ? S.depth + 1 : 0);
  }

  function renderRail() {
    var html = '<div class="rail-line"></div>';
    DEPTHS.forEach(function (d, i) {
      var cls = "stop";
      if (active() && i === S.depth) cls += " here";
      else if (active() && i < S.depth) cls += " passed";
      html += '<div class="' + cls + '"><div class="tick"></div><div class="stop-text"><b>' + d.name + '</b><span class="m">' + fmt(d.m) + ' m, ×' + d.mult + '</span></div></div>';
    });
    $rail.innerHTML = html;
  }

  function renderReadout() {
    rollNumber($depthNum, active() ? DEPTHS[S.depth].m : 0, 1100);
    var label = { home: "At the surface", gear: "At the dock", logbook: "In the logbook", stats: "At the surface", howto: "At the surface", final: "Back at the surface" }[S.screen] || "Back at the surface";
    $zoneLine.innerHTML = active()
      ? '<strong>' + DEPTHS[S.depth].name + ' zone</strong>, points ×' + DEPTHS[S.depth].mult + (S.mode === "daily" ? ', Daily Dive' : '')
      : label;
    $stats.classList.toggle("home", !inGame());
    $sDive.textContent = Math.min(Math.max(S.dive, 1), DIVES_PER_RUN);
    $riskWrap.hidden = !active();
    $sSpare.textContent = S.spares;
    if ($sPearls._val === undefined) setNumber($sPearls, save.pearls);
    var st = streakNow();
    $sStreak.textContent = st;
    $streakWrap.hidden = st === 0;
  }

  function shopButton(label, id, disabled) { return '<button class="' + (disabled ? 'ghost' : 'dive') + '" data-buy="' + id + '"' + (disabled ? ' disabled' : '') + '>' + label + '</button>'; }

  function renderPanel() {
    var h = "";
    var back = '<button class="ghost back" data-nav="home">← Back</button>';
    if (S.screen === "home") {
      var t = todayUTC(), done = save.daily[t];
      h = '<h2 class="prompt">How deep can you go?</h2>' +
        '<p class="sub">A press-your-luck finance quiz. Rare answers score big, crowded ones barely count. Bank your points as pearls and spend them on gear.</p>' +
        '<div class="modes">' +
        '<button class="mode daily" id="playDaily"' + (done !== undefined ? ' disabled' : '') + '><b>Daily Dive</b>' +
        '<span>Same categories for every diver today, standard gear, double pearls.</span>' +
        (done !== undefined ? '<span class="meta">Today: ' + fmt(done) + ' points. Next one in ' + untilNextDaily() + '.</span>' : '<span class="meta">Ready to dive</span>') +
        '</button>' +
        '<button class="mode" id="playFree"><b>Free Dive</b><span>Unlimited games with your gear and items. Earn pearls every time you bank.</span>' +
        '<span class="meta">Best: ' + fmt(save.best) + '</span></button>' +
        '</div>' +
        '<div class="nav">' +
        '<button class="ghost" data-nav="gear">Gear shop</button>' +
        '<button class="ghost" data-nav="logbook">Logbook ' + foundCount() + '/' + TOTAL_ANSWERS + '</button>' +
        '<button class="ghost" data-nav="stats">Stats and badges</button>' +
        '<button class="ghost" data-nav="howto">How to play</button>' +
        '</div>';
    } else if (S.screen === "howto") {
      h = back + '<h2 class="prompt">How to play</h2>' +
        '<ol class="rules">' +
        '<li>Each dive goes down five zones. Every zone asks for one answer in a finance category.</li>' +
        '<li>Your answer’s points are its rarity times the zone’s multiplier, and they go into your haul.</li>' +
        '<li>After each answer, surface to bank the haul or dive deeper for a bigger multiplier.</li>' +
        '<li>A wrong answer or running out of air loses the whole haul, unless you have a spare tank left.</li>' +
        '<li>Three dives per game. Reach the bottom for a depth bonus.</li>' +
        '<li>Everything you bank becomes pearls. The Daily Dive pays double.</li>' +
        '</ol>' +
        '<div class="scale">' + ["c", "u", "r", "k"].map(function (t) { return '<span class="tier' + (t === "k" ? " k" : "") + '">' + TIERS[t].name + ': ' + TIERS[t].pts + '</span>'; }).join("") + '</div>';
    } else if (S.screen === "gear") {
      h = back + '<h2 class="prompt">Gear shop</h2><p class="sub">You have 🦪 <strong>' + fmt(save.pearls) + '</strong> pearls. Upgrades and items work in Free Dive; the Daily Dive uses standard gear so scores stay fair.</p>';
      h += '<div class="section-h">Upgrades</div><ul class="shop">';
      Object.keys(UPGRADES).forEach(function (k) {
        var u = UPGRADES[k], lvl = save.up[k], max = u.costs.length, cost = u.costs[lvl];
        h += '<li><div class="info"><b>' + u.name + ' ' + '<span style="display:inline">(level ' + lvl + ' of ' + max + ')</span></b><span>' + u.desc + '</span></div>' +
          (lvl >= max ? shopButton("Maxed", "", true) : shopButton("🦪 " + fmt(cost), "up:" + k, save.pearls < cost)) + '</li>';
      });
      h += '</ul><div class="section-h">Items</div><ul class="shop">';
      Object.keys(ITEMS).forEach(function (k) {
        var it = ITEMS[k], have = save.items[k] || 0;
        h += '<li><div class="info"><b>' + it.name + ' <span style="display:inline">(you have ' + have + ')</span></b><span>' + it.desc + '</span></div>' +
          (have >= it.max ? shopButton("Full", "", true) : shopButton("🦪 " + it.cost, "item:" + k, save.pearls < it.cost)) + '</li>';
      });
      h += '</ul><div class="section-h">Swarm colors</div><ul class="shop">';
      Object.keys(SKINS).forEach(function (k) {
        var s = SKINS[k], owned = save.skins[k], on = save.skin === k;
        var sw = s.rainbow ? 'background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bff9e,#6bc5ff,#c56bff)' : 'background:rgb(' + s.body + ')';
        h += '<li><div class="info"><b><span class="swatch" style="' + sw + '"></span>' + s.name + '</b></div>' +
          (on ? shopButton("Equipped", "", true) : owned ? '<button class="ghost" data-buy="skin:' + k + '">Equip</button>' : shopButton("🦪 " + fmt(s.cost), "skin:" + k, save.pearls < s.cost)) + '</li>';
      });
      h += '</ul>';
    } else if (S.screen === "logbook") {
      var n = foundCount(), ab = Object.keys(save.found).filter(function (id) { return save.found[id] === "k"; }).length;
      h = back + '<h2 class="prompt">Logbook</h2><p class="sub">You’ve found ' + n + ' of ' + TOTAL_ANSWERS + ' answers, including ' + ab + ' Abyssal. Tap a category to see your finds.</p>';
      DEPTHS.forEach(function (d) {
        h += '<div class="section-h">' + d.name + ' zone</div>';
        d.cats.forEach(function (k) {
          var ents = CATS[k].entries, got = ents.filter(function (e) { return save.found[e.id]; });
          var pct = Math.round(got.length / ents.length * 100);
          h += '<details class="logcat"><summary><div class="top"><span>' + esc(catLabel(k)) + '</span><span>' + got.length + ' / ' + ents.length + '</span></div><div class="bar"><i style="width:' + pct + '%"></i></div></summary><div class="chips">' +
            got.map(function (e) { return '<span class="chip ' + e.tier + '">' + esc(e.display) + '</span>'; }).join("") +
            '<span class="chip hidden">' + (ents.length - got.length) + ' still hidden</span></div></details>';
        });
      });
    } else if (S.screen === "stats") {
      var games = save.games, last = games.slice(-20);
      var avg = last.length ? Math.round(last.reduce(function (a, g) { return a + g.score; }, 0) / last.length) : 0;
      h = back + '<h2 class="prompt">Stats and badges</h2>' +
        '<div class="grid-stats">' +
        '<div><b>' + fmt(save.best) + '</b><span>Best score</span></div>' +
        '<div><b>' + fmt(avg) + '</b><span>Average, last 20</span></div>' +
        '<div><b>' + fmt(games.length) + '</b><span>Games played</span></div>' +
        '<div><b>' + streakNow() + '</b><span>Daily streak (best ' + save.streak.best + ')</span></div>' +
        '<div><b>' + fmt(save.lifetime) + '</b><span>Pearls earned</span></div>' +
        '</div>' + chartSVG(games.slice(-15)) +
        '<div class="section-h">Diver name</div><p class="section-note">Shown on leaderboards when the site has one.</p>' +
        '<div class="namefield"><input type="text" id="nameIn" maxlength="16" aria-label="Diver name" value="' + esc(diverName()) + '"><button class="ghost" id="nameSave">Save</button></div>' +
        '<div class="section-h">Badges</div><ul class="ach">' +
        ACHIEVEMENTS.map(function (a) { var got = !!save.ach[a.id]; return '<li class="' + (got ? "got" : "locked") + '"><b>' + (got ? "🏅 " : "") + esc(a.name) + '</b><span>' + esc(a.desc) + ' +' + a.reward + ' pearls</span></li>'; }).join("") +
        '</ul>';
    } else if (S.screen === "question") {
      var items = S.mode === "free"
        ? '<div class="tools">' +
          '<button class="ghost" id="useSonar"' + ((save.items.sonar || 0) < 1 || S.sonarUsed ? ' disabled' : '') + '>📡 Sonar (' + (save.items.sonar || 0) + ')</button>' +
          '<button class="ghost' + (S.charm ? ' armed' : '') + '" id="useCharm"' + ((save.items.charm || 0) < 1 && !S.charm ? ' disabled' : '') + '>🍀 ' + (S.charm ? 'Charm armed: ×2' : 'Lucky charm (' + (save.items.charm || 0) + ')') + '</button>' +
          '</div>'
        : '';
      h = '<h2 class="prompt">' + esc(CATS[S.cat].q) + '</h2>' +
        '<p class="sub">Worth ' + DEPTHS[S.depth].mult + '× here. You can’t reuse an answer in the same game.</p>' +
        '<div class="air" id="airBar" aria-hidden="true"><div class="air-fill" id="airFill"></div></div>' +
        '<div class="air-label" id="airLabel">' + S.g.air + ' seconds of air</div>' +
        '<form class="row" id="f" autocomplete="off">' +
        '<input type="text" id="ans" aria-label="Your answer" placeholder="Type your answer" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">' +
        '<button type="submit">Lock it in</button>' +
        '</form>' +
        '<div class="hint" id="hint">' + esc(S.hint) + '</div>' +
        '<div class="msg ' + S.msgKind + '" id="msg">' + esc(S.msg) + '</div>' + items;
    } else if (S.screen === "caught") {
      var L = S.last, lastDepth = S.depth === DEPTHS.length - 1, rarer = sample(S.cat, ["k"], 1);
      h = '<div class="catch"><span class="catch-pts">+' + L.pts + '</span><span class="catch-name">' + esc(L.display) + '</span></div>' +
        '<div><span class="tier stamp' + (L.tier === "k" ? " k" : "") + '">' + TIERS[L.tier].name + '</span> <span class="sub" style="display:inline">' + TIERS[L.tier].pts + ' × ' + DEPTHS[S.depth].mult + (L.charm ? ' × 2 charm' : '') + (L.isNew ? ', new to your logbook' : '') + '</span></div>' +
        (L.tier !== "k" && rarer.length ? '<p class="examples">An Abyssal catch would have been <strong>' + esc(rarer[0]) + '</strong>.</p>' : '') +
        (lastDepth ? '<p class="examples">You’ve hit the bottom of the trench. Surface with a +' + S.g.bonus + ' bonus.</p>' : '') +
        '<div class="actions">' +
        '<button class="' + (lastDepth ? "dive" : "ghost") + '" id="bank">Surface and bank ' + fmt(S.haul + (lastDepth ? S.g.bonus : 0)) + '</button>' +
        (lastDepth ? '' : '<button class="dive" id="deeper">Dive to ' + DEPTHS[S.depth + 1].name + ' (×' + DEPTHS[S.depth + 1].mult + ')</button>') +
        '</div>';
    } else if (S.screen === "lost") {
      var ex = sample(S.cat, ["r", "k"], 3);
      h = '<div class="catch"><span class="catch-pts lost">−' + fmt(S.lostHaul) + '</span><span class="catch-name">Haul lost</span></div>' +
        '<p class="sub">' + esc(S.msg) + ' Nothing from this dive was banked.</p>' +
        (ex.length ? '<p class="examples">Answers that would have worked: <strong>' + ex.map(esc).join("</strong>, <strong>") + '</strong>.</p>' : '') +
        nextActions();
    } else if (S.screen === "banked") {
      h = '<div class="catch"><span class="catch-pts">+' + fmt(S.lastBank) + '</span><span class="catch-name">Banked</span></div>' +
        '<p class="sub">Safe at the surface. Total banked: ' + fmt(S.banked) + '.</p>' + nextActions();
    } else if (S.screen === "final") {
      h = '<h2 class="prompt">' + (S.mode === "daily" ? "Daily Dive score" : "Final score") + ': <span class="gold">' + fmt(S.banked) + '</span></h2>' +
        '<p class="sub">+' + fmt(S.earned) + ' pearls' + (S.mode === "daily" ? ' (doubled for the Daily Dive)' : '') +
        (S.newFinds ? ', ' + S.newFinds + ' new logbook ' + (S.newFinds === 1 ? 'entry' : 'entries') : '') + '.' +
        (S.newBest ? ' New personal best!' : '') + '</p>' +
        '<div class="compare" id="compare">' + personalCompare() + '</div>' +
        (S.unlocked.length ? '<div class="section-h">Badges earned</div><div class="chips">' + S.unlocked.map(function (a) { return '<span class="chip k">🏅 ' + esc(a.name) + '</span>'; }).join("") + '</div>' : '') +
        (S.log.length ? '<ul class="ledger">' + S.log.map(function (l) {
          return '<li><span>' + esc(l.display) + (l.tier ? ' <span class="sub" style="display:inline">(' + TIERS[l.tier].name + ')</span>' : '') + '</span><span>' + (l.lost ? 'lost' : '+' + l.pts) + '</span></li>';
        }).join("") + '</ul>' : '') +
        '<div class="actions"><button class="dive" id="again">Free Dive again</button><button class="ghost" data-nav="home">Home</button></div>';
    }
    $panel.innerHTML = h;
    retrigger($panel, "enter");
    bind();
  }

  function chartSVG(games) {
    if (!games.length) return '<p class="section-note" style="margin-top:12px">Play a game to see your score history here.</p>';
    var max = Math.max.apply(null, games.map(function (g) { return g.score; }).concat([10]));
    var w = 100 / 15, bars = "";
    games.forEach(function (g, i) {
      var hgt = Math.max(2, g.score / max * 100);
      bars += '<rect x="' + (i * w + w * 0.15) + '" y="' + (110 - hgt) + '" width="' + (w * 0.7) + '" height="' + hgt + '" rx="1.5" fill="' + (g.mode === "daily" ? "#F5C451" : "#FF8C7A") + '"><title>' + g.score + (g.mode === "daily" ? " (daily)" : "") + '</title></rect>';
    });
    return '<div class="section-h">Recent games</div><p class="section-note">Coral bars are Free Dives, gold bars are Daily Dives.</p><svg class="chart" viewBox="0 0 100 112" preserveAspectRatio="none" role="img" aria-label="Recent scores">' + bars + '</svg>';
  }

  function personalCompare() {
    var prev = save.games.slice(0, -1).filter(function (g) { return g.mode === S.mode; }).slice(-20);
    if (!prev.length) return "This is your first " + (S.mode === "daily" ? "Daily Dive" : "Free Dive") + " on record. Play more to see how you stack up against yourself.";
    var avg = Math.round(prev.reduce(function (a, g) { return a + g.score; }, 0) / prev.length);
    var diff = S.banked - avg;
    return "Your recent average is <strong>" + fmt(avg) + "</strong>, so this game was <strong>" + (diff >= 0 ? "+" : "−") + fmt(Math.abs(diff)) + "</strong> " + (diff >= 0 ? "above" : "below") + " it.";
  }

  function globalCompare() {
    if (!Board.on()) return;
    var mode = S.mode, day = todayUTC(), mine = S.banked;
    Board.submit({ day: day, mode: mode, score: mine, name: diverName() }).then(function () { return Board.day(day, mode); }).then(function (rows) {
      var box = document.getElementById("compare");
      if (!box || !rows || !rows.length) return;
      var scores = rows.map(function (r) { return r.score; });
      var avg = Math.round(scores.reduce(function (a, b) { return a + b; }, 0) / scores.length);
      var below = scores.filter(function (s) { return s < mine; }).length;
      var pct = Math.round(below / scores.length * 100);
      var top = rows.slice(0, 5).map(function (r) { return "<li>" + esc(r.name || "Diver") + ": " + fmt(r.score) + "</li>"; }).join("");
      box.innerHTML = personalCompare() + "<br>Today’s " + (mode === "daily" ? "Daily Dive" : "Free Dive") + " average across <strong>" + fmt(scores.length) + "</strong> games is <strong>" + fmt(avg) + "</strong>. You beat <strong>" + pct + "%</strong> of them." +
        '<div class="section-h" style="margin-top:12px">Today’s top divers</div><ol class="board">' + top + "</ol>";
    });
  }

  function nextActions() {
    if (S.dive < DIVES_PER_RUN) return '<div class="actions"><button class="dive" id="next">Start dive ' + (S.dive + 1) + '</button></div>';
    return '<div class="actions"><button class="dive" id="finish">See final score</button></div>';
  }

  function render() { setSea(); renderRail(); renderReadout(); renderPanel(); }
  function go(screen) { S.screen = screen; render(); window.scrollTo(0, 0); }

  function bind() {
    var el;
    $panel.querySelectorAll("[data-nav]").forEach(function (b) { b.onclick = function () { go(b.getAttribute("data-nav")); }; });
    $panel.querySelectorAll("[data-buy]").forEach(function (b) { b.onclick = function () { buy(b.getAttribute("data-buy"), b); }; });
    if ((el = document.getElementById("playDaily"))) el.onclick = function () { newGame("daily"); };
    if ((el = document.getElementById("playFree"))) el.onclick = function () { newGame("free"); };
    if ((el = document.getElementById("next"))) el.onclick = startDive;
    if ((el = document.getElementById("again"))) el.onclick = function () { newGame("free"); };
    if ((el = document.getElementById("finish"))) el.onclick = finish;
    if ((el = document.getElementById("bank"))) el.onclick = bank;
    if ((el = document.getElementById("deeper"))) el.onclick = function () { descend(S.depth + 1); };
    if ((el = document.getElementById("useSonar"))) el.onclick = useSonar;
    if ((el = document.getElementById("useCharm"))) el.onclick = toggleCharm;
    if ((el = document.getElementById("nameSave"))) el.onclick = function () {
      var v = document.getElementById("nameIn").value.trim().slice(0, 16);
      if (v) { save.name = v; persist(); el.textContent = "Saved"; }
    };
    var f = document.getElementById("f");
    if (f) {
      f.onsubmit = function (e) { e.preventDefault(); submit(document.getElementById("ans").value); };
      document.getElementById("ans").focus();
    } else if (S.screen !== "home" && S.screen !== "gear" && S.screen !== "logbook" && S.screen !== "stats" && S.screen !== "howto") {
      var btn = $panel.querySelector(".actions button.dive");
      if (btn) setTimeout(function () { if (document.activeElement === document.body || !document.activeElement) btn.focus({ preventScroll: true }); }, 450);
    }
  }

  /* ---------- Shop ---------- */
  function buy(code, btn) {
    var p = code.split(":"), kind = p[0], k = p[1], cost = 0;
    if (kind === "up") {
      cost = UPGRADES[k].costs[save.up[k]];
      if (cost === undefined || save.pearls < cost) return;
      save.pearls -= cost; save.up[k] += 1;
    } else if (kind === "item") {
      cost = ITEMS[k].cost;
      if (save.pearls < cost || (save.items[k] || 0) >= ITEMS[k].max) return;
      save.pearls -= cost; save.items[k] = (save.items[k] || 0) + 1;
    } else if (kind === "skin") {
      if (!save.skins[k]) {
        cost = SKINS[k].cost;
        if (save.pearls < cost) return;
        save.pearls -= cost; save.skins[k] = true;
      }
      save.skin = k; Ocean.setSkin(SKINS[k]);
    }
    persist();
    var c = center(btn);
    Ocean.burst(c.x, c.y, 40, ["#F5C451", "#FF8C7A", "#FFFFFF"], 1.2);
    sfx.bank(); buzz(15);
    rollNumber($sPearls, save.pearls, 500);
    renderPanel();
  }

  function useSonar() {
    if (S.sonarUsed || (save.items.sonar || 0) < 1) return;
    var pool = CATS[S.cat].entries.filter(function (e) { return (e.tier === "r" || e.tier === "k") && !S.used[e.id]; });
    if (!pool.length) return;
    var e = pool[Math.floor(Math.random() * pool.length)];
    save.items.sonar -= 1; persist();
    S.sonarUsed = true;
    S.hint = "📡 " + TIERS[e.tier].name + ": " + e.display.split(" ").map(function (w, wi) {
      return w.split("").map(function (ch, i) { return wi === 0 && i === 0 ? ch.toUpperCase() : /[a-z0-9]/i.test(ch) ? "_" : ch; }).join(" ");
    }).join("   ");
    var hint = document.getElementById("hint"); if (hint) hint.textContent = S.hint;
    var b = document.getElementById("useSonar"); if (b) { b.disabled = true; b.textContent = "📡 Sonar (" + save.items.sonar + ")"; }
    sfx.tick(); tone(880, 0.05, 0.4, "sine", 0.08, 1760);
    var inp = document.getElementById("ans"); if (inp) inp.focus();
  }
  function toggleCharm() {
    if (S.charm) return;
    if ((save.items.charm || 0) < 1) return;
    save.items.charm -= 1; persist();
    S.charm = true;
    var b = document.getElementById("useCharm"); if (b) { b.classList.add("armed"); b.textContent = "🍀 Charm armed: ×2"; }
    sfx.coin(6);
    var inp = document.getElementById("ans"); if (inp) inp.focus();
  }

  /* ---------- Game flow ---------- */
  function newGame(mode) {
    stopTimer();
    if (mode === "daily" && save.daily[todayUTC()] !== undefined) mode = "free";
    S.mode = mode;
    S.rng = mode === "daily" ? mulberry(hashStr("abyss-" + todayUTC())) : Math.random;
    S.g = gear(mode);
    S.dive = 0; S.banked = 0; S.spares = S.g.spares; S.used = {}; S.usedCats = {}; S.log = [];
    S.newFinds = 0; S.unlocked = []; S.allBanked = true; S.charm = false;
    setNumber($sBank, 0);
    startDive();
  }

  function startDive() {
    S.dive += 1; S.haul = 0; S.pending = [];
    setNumber($sRisk, 0);
    descend(0);
  }

  function descend(d) {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    S.depth = d;
    S.cat = pickCat(d);
    S.msg = ""; S.msgKind = ""; S.hint = ""; S.sonarUsed = false;
    S.screen = "question";
    Ocean.dive(); sfx.dive(); buzz(20);
    render();
    startTimer();
  }

  function submit(val) {
    if (!val || !val.trim()) return;
    var input = document.getElementById("ans");
    var pos = input ? center(input) : { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    var entry = lookup(S.cat, val);
    if (entry && S.used[entry.id]) {
      showMsg(entry.display + " is already used this game. Try another.", "note");
      clearInput();
      return;
    }
    if (!entry) { fail("“" + val.trim() + "” isn’t in the logbook for this category.", pos); return; }
    var airLeft = S.air;
    stopTimer();
    S.used[entry.id] = true;
    var charm = S.charm; S.charm = false;
    var pts = TIERS[entry.tier].pts * DEPTHS[S.depth].mult * (charm ? 2 : 1);
    S.haul += pts;
    var isNew = !save.found[entry.id];
    if (isNew) { save.found[entry.id] = entry.tier; S.newFinds += 1; persist(); }
    S.last = { display: entry.display, tier: entry.tier, pts: pts, charm: charm, isNew: isNew };
    S.pending.push(S.last);

    var t = entry.tier;
    var count = { c: 14, u: 30, r: 55, k: 140 }[t];
    var colors = t === "k" ? ["#F5C451", "#FF8C7A", "#FFFFFF", "#FFD98A"] : t === "r" ? ["#FF8C7A", "#F5C451", "#FFFFFF"] : ["#FF8C7A", "#BFF3FF"];
    Ocean.burst(pos.x, pos.y, count, colors, t === "k" ? 1.8 : t === "r" ? 1.3 : 1);
    floatText("+" + pts, pos.x, pos.y, t === "k" || charm ? "k" : "");
    sfx.correct(t);
    if (t === "k") { banner("Abyssal find!"); flash("radial-gradient(circle, rgba(245,196,81,0.6), transparent 70%)"); buzz([20, 30, 20, 30, 70]); }
    else if (t === "r") { flash("radial-gradient(circle, rgba(255,140,122,0.35), transparent 70%)"); buzz([15, 25, 15]); }
    else buzz(12);

    S.screen = "caught";
    render();
    rollNumber($sRisk, S.haul, 700);
    retrigger($sRisk, "bump");

    if (t === "k") unlock("abyssal");
    if (airLeft < 3) unlock("clutch");
    if (isNew) checkCollection();
  }

  function clearInput() { var i = document.getElementById("ans"); if (i) { i.value = ""; i.focus(); } }
  function showMsg(t, kind) {
    S.msg = t; S.msgKind = kind;
    var m = document.getElementById("msg");
    if (m) { m.textContent = t; m.className = "msg " + kind; }
  }

  function fail(reason, pos) {
    pos = pos || center($panel);
    Ocean.scatter(pos.x, pos.y);
    retrigger($panel, "shake");
    flash("rgba(179,58,43,0.45)");
    buzz([60, 40, 60]);
    if (S.spares > 0) {
      S.spares -= 1;
      sfx.spare();
      $sSpare.textContent = S.spares;
      retrigger($sSpare, "bump");
      showMsg(reason + " Spare tank used: fresh air, one more try." + (S.spares ? " " + S.spares + " left." : ""), "bad");
      clearInput();
      startTimer();
      return;
    }
    sfx.wrong();
    stopTimer();
    S.charm = false;
    S.allBanked = false;
    if (S.haul > 0) { var rp = center($sRisk); floatText("−" + fmt(S.haul), rp.x, rp.y, "fall"); }
    S.pending.forEach(function (p) { S.log.push({ display: p.display, tier: p.tier, pts: p.pts, lost: true }); });
    S.pending = [];
    S.lostHaul = S.haul;
    S.haul = 0;
    S.msg = reason;
    S.screen = "lost";
    setTimeout(function () { Ocean.surface(); render(); }, REDUCE ? 0 : 380);
  }

  function bank() {
    var bonus = S.depth === DEPTHS.length - 1 ? S.g.bonus : 0;
    var amount = S.haul + bonus;
    var from = document.getElementById("bank") || $panel;
    var n = Math.min(22, 5 + Math.floor(amount / 8));
    var wasHadal = S.depth === DEPTHS.length - 1;
    S.lastBank = amount;
    S.banked += amount;
    S.pending.forEach(function (p) { S.log.push({ display: p.display, tier: p.tier, pts: p.pts }); });
    if (bonus) S.log.push({ display: "Depth bonus", tier: null, pts: bonus });
    S.pending = []; S.haul = 0;
    S.screen = "banked";
    Ocean.surface();
    var total = S.banked;
    var startPt = center(from);
    render();
    if (bonus) banner("Full depth +" + bonus);
    coinsTo({ getBoundingClientRect: function () { return { left: startPt.x, top: startPt.y, width: 0, height: 0 }; } }, $sBank, n, function () {
      rollNumber($sBank, total, 600);
      retrigger($sBank, "bump");
      sfx.bank(); buzz(15);
    });
    if (wasHadal) unlock("trench");
    if (amount >= 100) unlock("haul100");
  }

  function finish() {
    var score = S.banked, day = todayUTC();
    S.newBest = score > save.best;
    if (S.newBest) save.best = score;
    save.games.push({ score: score, mode: S.mode, day: day });
    if (save.games.length > 200) save.games = save.games.slice(-200);
    if (S.mode === "daily") {
      save.daily[day] = score;
      var st = save.streak;
      if (st.last !== day) {
        st.count = st.last === dayBefore(day) ? st.count + 1 : 1;
        st.last = day;
        st.best = Math.max(st.best, st.count);
      }
    }
    S.earned = score * (S.mode === "daily" ? DAILY_PEARL_MULT : 1);
    persist();
    unlock("first");
    if (S.allBanked) unlock("sweep");
    if (score >= 250) unlock("score250");
    if (streakNow() >= 3) unlock("streak3");
    if (streakNow() >= 7) unlock("streak7");
    S.screen = "final";
    render();
    var pearlsFrom = document.querySelector(".prompt .gold") || $panel;
    if (S.earned > 0) {
      coinsTo(pearlsFrom, $sPearls, Math.min(24, 6 + Math.floor(S.earned / 15)), function () { addPearls(S.earned); sfx.bank(); });
    }
    if (S.newBest && score > 0) {
      banner("New best!");
      sfx.best();
      var w = window.innerWidth;
      [0.2, 0.5, 0.8].forEach(function (fx, i) {
        setTimeout(function () { Ocean.burst(w * fx, window.innerHeight * 0.35, 90, ["#F5C451", "#FF8C7A", "#BFF3FF", "#FFFFFF"], 1.6); }, i * 220);
      });
    }
    globalCompare();
  }

  Ocean.init();
  setNumber($sPearls, save.pearls);
  render();
})();
</script>
</body>
</html>
